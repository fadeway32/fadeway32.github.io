            - heading "3.2.2 cleanOfflineBroker清除下线的broker3.2.2 cleanOfflineBroker清除下线的broker" [level=4] [ref=e965]:
                - link "3.2.2 cleanOfflineBroker清除下线的broker":
                    - /url: "#3-2-2-cleanOfflineBroker清除下线的broker"
                - text: 3.2.2 cleanOfflineBroker清除下线的broker
            - paragraph [ref=e966]:
                - text: 该方法是每隔30s清除下线的broker的定时任务方法。该方法会遍历并且更新brokerAddrTable这个map集合，该集合类型为
                - code [ref=e967]: ConcurrentMap<String/* Broker Name */, HashMap<Long/* brokerId */, String/* address */>>
                - text: 。
            - paragraph [ref=e968]: 其主要步骤就是获取每一个address，然后去本地路由信息集合topicRouteTable中查找判断broker地址是否存在于topicRouteTable的任意一个topic的路由信息中，如果不存在，则表示该broker已下线，那么清除该broker地址，否则保留。如果brokerAddrTable中的value集合也是空的，那么直接删除键值对。
