                                    - generic [ref=e695]:
                                        - text: public boolean updateTopicRouteInfoFromNameServer
                                        - generic [ref=e696]: (final String topic, boolean isDefault,
                                    - generic [ref=e697]: "DefaultMQProducer defaultMQProducer) {"
                                    - generic [ref=e698]: "try {"
                                    - generic [ref=e699]: //加锁防止并发
                                    - generic [ref=e700]: "if (this.lockNamesrv.tryLock(LOCK_TIMEOUT_MILLIS, TimeUnit.MILLISECONDS)) {"
                                    - generic [ref=e701]: "try {"
                                    - text: TopicRouteData topicRouteData;
                                    - generic [ref=e702]: /*
                                    - generic [ref=e703]: "* 1 通过默认topic和producer去获取路由信息时走此逻辑"
                                    - generic [ref=e704]: "*/"
                                    - generic [ref=e705]: "if (isDefault && defaultMQProducer != null) {"
                                    - generic [ref=e706]: //获取指定的topic “TBW102” 的路由信息
                                    - generic [ref=e707]: topicRouteData = this.mQClientAPIImpl.getDefaultTopicRouteInfoFromNameServer(defaultMQProducer.getCreateTopicKey(),
                                    - text: clientConfig.getMqClientApiTimeout());
                                    - generic [ref=e708]: "if (topicRouteData != null) {"
                                    - generic [ref=e709]: //更新队列数据，设置读写队列数量
                                    - generic [ref=e710]: "for (QueueData data : topicRouteData.getQueueDatas()) {"
                                    - generic [ref=e711]: int queueNums = Math.min(defaultMQProducer.getDefaultTopicQueueNums(), data.getReadQueueNums());
                                    - text: data.setReadQueueNums(queueNums);
                                    - text: data.setWriteQueueNums(queueNums);
                                    - text: "}"
                                    - text: "}"
                                    - generic [ref=e712]: "} else {"
                                    - generic [ref=e713]: /*
                                    - generic [ref=e714]: "* 2 定时任务会走该逻辑"
                                    - generic [ref=e715]: "* 从nameServer获取当前指定topic的路由信息"
                                    - generic [ref=e716]: "*/"
                                    - generic [ref=e717]: topicRouteData = this.mQClientAPIImpl.getTopicRouteInfoFromNameServer(topic, clientConfig.getMqClientApiTimeout());
                                    - text: "}"
                                    - generic [ref=e718]: /*
                                    - generic [ref=e719]: "* 3 如果获取到的路由信息不为空，那么比较看是否需要更新本地路由信息"
                                    - generic [ref=e720]: "*/"
                                    - generic [ref=e721]: "if (topicRouteData != null) {"
                                    - generic [ref=e722]: //从topicRouteTable中获取本地缓存的topic路由信息
                                    - generic [ref=e723]: TopicRouteData old = this.topicRouteTable.get(topic);
                                    - generic [ref=e724]: /*
                                    - generic [ref=e725]: "* 4 比较nameServer的topic路由和本地topic路由，看是否不相同"
                                    - generic [ref=e726]: "*/"
