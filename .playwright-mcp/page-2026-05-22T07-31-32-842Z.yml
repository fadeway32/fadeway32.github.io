            - paragraph [ref=e676]:
                - text: 该方法用于从nameServer拉取并更新topic的路由信息，topic的路由信息由broker上报给nameServer。
                - text: 从nameSerer拉取到topic路由信息之后，调用topicRouteDataIsChange方法与本地的旧topic路由信息比较看是否更改，比较的数据包括：topic的队列信息queueDatas，topic的broker信息brokerDatas，顺序topic配置orderTopicConf，消费过滤信息filterServerTable。
                - text: 当判断需要更新的时候，会更新本地的topic缓存，包括：
            - paragraph [ref=e677]:
                - strong [ref=e678]: 1、
                - text: 更新brokerName到brokerAddr的地址的映射关系，即brokerAddrTable；
                - strong [ref=e679]: 2、
                - text: 更新生产者的producerTable集合，更新MQProducerInner的topicPublishInfoTable属性；
                - strong [ref=e680]: 3、
                - text: 更新消费者的consumerTable集合，更新MQConsumerInner的rebalanceImpl.topicSubscribeInfoTable属性；
                - strong [ref=e681]: 4、
                - text: 更新topicRouteTable集合，更新本地topic路由信息；
