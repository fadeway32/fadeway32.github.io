            - heading "3.2.3.1 sendHeartbeatToAllBroker给所有broker发送心跳包3.2.3.1 sendHeartbeatToAllBroker给所有broker发送心跳包" [level=5] [ref=e1068]:
                - link "3.2.3.1 sendHeartbeatToAllBroker给所有broker发送心跳包":
                    - /url: "#3-2-3-1-sendHeartbeatToAllBroker给所有broker发送心跳包"
                - text: 3.2.3.1 sendHeartbeatToAllBroker给所有broker发送心跳包
            - paragraph [ref=e1069]: 该方法用于给所有broker发送心跳包，首先会通过prepareHeartbeatData方法准备心跳数据包，如果数据包中没有任何生产者和消费者的信息，那么不会发送心跳包，直接返回。
            - paragraph [ref=e1070]: 然后会遍历brokerAddrTable中的broker地址，开始循环发送心跳包。此时还需要判断，如果数据包中没有消费者的信息并且当前broker不是Master节点，那么无需向该broker发送心跳包，因为此时该应用中只有生产者启动，而生产者只能给Master发送消息数据。但是如果该应用启动了消费者，由于消费者可以从Master和Slave拉取消息，因此会向所有broker发送心跳包。
            - paragraph [ref=e1071]:
                - text: 发送心跳包的请求编码为请求编码为
                - strong [ref=e1072]: HEART_BEAT
                - text: 。
