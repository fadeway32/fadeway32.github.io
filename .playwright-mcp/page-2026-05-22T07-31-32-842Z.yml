                                        - generic [ref=e903]: (final String addr)
                                        - text: "throws RemotingConnectException, InterruptedException {"
                                    - generic [ref=e904]: /*
                                    - generic [ref=e905]: "* 如果addr为null，则获取并且创建nameServer长连接"
                                    - generic [ref=e906]: "*/"
                                    - generic [ref=e907]: "if (null == addr) {"
                                    - generic [ref=e908]: return getAndCreateNameserverChannel();
                                    - text: "}"
                                    - generic [ref=e909]: /*
                                    - generic [ref=e910]: "* 否则，尝试从缓存中获取长连接，获取不到才会创建"
                                    - generic [ref=e911]: "*/"
                                    - generic [ref=e912]: ChannelWrapper cw = this.channelTables.get(addr);
                                    - generic [ref=e913]: "if (cw != null && cw.isOK()) {"
                                    - generic [ref=e914]: return cw.getChannel();
                                    - text: "}"
                                    - generic [ref=e915]: return this.createChannel(addr);
                                    - text: "}"
                                    - generic [ref=e916]: /**
                                    - generic [ref=e917]: "* NettyRemotingClient的方法"
                                    - generic [ref=e918]: "* 获取并建立nameServer连接"
                                    - generic [ref=e919]: "*/"
                                    - generic [ref=e920]: "private Channel getAndCreateNameserverChannel() throws RemotingConnectException, InterruptedException {"
                                    - generic [ref=e921]: //如果此前已经选择了nameServer，并且通道存在且是激活状态，那么直接获取该nameServer的通道
                                    - generic [ref=e922]: //即通道可以被不同的consumer和producer复用
                                    - generic [ref=e923]: String addr = this.namesrvAddrChoosed.get();
                                    - generic [ref=e924]: "if (addr != null) {"
                                    - generic [ref=e925]: ChannelWrapper cw = this.channelTables.get(addr);
                                    - generic [ref=e926]: "if (cw != null && cw.isOK()) {"
                                    - generic [ref=e927]: return cw.getChannel();
                                    - text: "}"
                                    - text: "}"
                                    - generic [ref=e928]: final List<String> addrList = this.namesrvAddrList.get();
                                    - generic [ref=e929]: //加锁
                                    - generic [ref=e930]: "if (this.namesrvChannelLock.tryLock(LOCK_TIMEOUT_MILLIS, TimeUnit.MILLISECONDS)) {"
                                    - generic [ref=e931]: //加锁之后再次判断，防止并发
                                    - generic [ref=e932]: "try {"
                                    - generic [ref=e933]: addr = this.namesrvAddrChoosed.get();
                                    - generic [ref=e934]: "if (addr != null) {"
                                    - generic [ref=e935]: ChannelWrapper cw = this.channelTables.get(addr);
                                    - generic [ref=e936]: "if (cw != null && cw.isOK()) {"
                                    - generic [ref=e937]: return cw.getChannel();
                                    - text: "}"
                                    - text: "}"
                                    - generic [ref=e938]: /*
                                    - generic [ref=e939]: "* 选择一个nameServer建立长连接"
                                    - generic [ref=e940]: "*/"
                                    - generic [ref=e941]: "if (addrList != null && !addrList.isEmpty()) {"
                                    - generic [ref=e942]: "for (int i = 0; i < addrList.size(); i++) {"
                                    - generic [ref=e943]: //获取下一个nameServer的索引，初始化数据是随机生成的
                                    - generic [ref=e944]: int index = this.namesrvIndex.incrementAndGet();
                                    - generic [ref=e945]: //取绝对值
                                    - text: index = Math.abs(index);
                                    - generic [ref=e946]: //对nameServer集合长度取余数
                                    - text: index = index % addrList.size();
                                    - generic [ref=e947]: //获取最终确定的nameServer地址
                                    - generic [ref=e948]: String newAddr = addrList.get(index);
                                    - generic [ref=e949]: //设置到被选择的namesrvAddrChoosed属性中
                                    - generic [ref=e950]: this.namesrvAddrChoosed.set(newAddr);
                                    - generic [ref=e951]: "log.info(\"new name server is chosen. OLD: {} , NEW: {}. namesrvIndex = {}\", addr, newAddr, namesrvIndex);"
                                    - generic [ref=e952]: //针对被选择的地址建立长连接
                                    - generic [ref=e953]: Channel channelNew = this.createChannel(newAddr);
                                    - generic [ref=e954]: //如果建立连接成功就返回，否则集训循环选择下一个nameServer地址创建
