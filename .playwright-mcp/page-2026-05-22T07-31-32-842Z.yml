                                    - generic [ref=e854]: "throws InterruptedException, RemotingConnectException, RemotingSendRequestException, RemotingTimeoutException {"
                                    - generic [ref=e855]: long beginStartTime = System.currentTimeMillis();
                                    - generic [ref=e856]: //根据addr建立连接，获取channel，随机选择nameServer连接的逻辑就在这里
