            - paragraph [ref=e550]: start方法的最后，还启动了一个定时任务scanResponseTable。这里主要是用于处理通信时的异常情况。RocketMQ会将请求结果封装为一个ResponseFuture并且存入responseTable中。那么在发送消息时候，如果遇到服务端没有response返回给客户端或者response因网络而丢失等异常情况。此时可能造成responseTable中的ResponseFuture累积，因此该任务会每隔一秒扫描一次responseTable，将超时的ResponseFuture直接移除，并且执行这些超时ResponseFuture的回调。具体的源码和逻辑，我们同样会在RocketMQ的请求和相应部分解析。
            - heading "3.2 startScheduledTask启动各种定时任务3.2 startScheduledTask启动各种定时任务" [level=3] [ref=e551]:
                - link "3.2 startScheduledTask启动各种定时任务":
                    - /url: "#3-2-startScheduledTask启动各种定时任务"
                - text: 3.2 startScheduledTask启动各种定时任务
            - paragraph [ref=e552]: 该方法启动五个定时任务：
            - paragraph [ref=e553]:
                - strong [ref=e554]: 1、
                - text: 如果没有手动指定namesrvAddr，那么每隔2m从nameServer地址服务器拉取最新的nameServer地址并更新；
                - strong [ref=e555]: 2、
                - text: 每隔30S尝试从nameServer更新topic路由信息；
                - strong [ref=e556]: 3、
                - text: 每隔30S尝试清除无效的broker信息，以及发送心跳信息给所有broker；
                - strong [ref=e557]: 4、
                - text: 每隔5S尝试持久化消费者偏移量，即消费进度广播消费模式下持久化到本地，集群消费模式下推送到broker端该定时任务针对消费者，后面学习消费者的时候再学习源码；
                - strong [ref=e558]: 5、
                - text: 每隔1m尝试调整push模式的消费线程池的线程数量，该定时任务针对消费者，目前默认没有实现该功能，是一个空方法实现；
            - paragraph [ref=e559]: 注意，这些定时任务是MQClientInstance实例启动的，而一个应用的所有consumer和producer共用该MQClientInstance实例，因此，这些定时任务也可以说属于该应用的每一个consumer和producer。
