                                    - generic [ref=e484]: //主要用于执行在真正执行业务逻辑之前需要进行的SSL验证、编解码、空闲检查、网络连接管理等操作
                                    - generic [ref=e485]: //其工作时间位于IO线程组之后，process线程组之前
                                    - generic [ref=e486]: this.defaultEventExecutorGroup = new DefaultEventExecutorGroup(
                                    - text: nettyClientConfig.getClientWorkerThreads(),
                                    - generic [ref=e487]: "new ThreadFactory() {"
                                    - generic [ref=e488]: private AtomicInteger threadIndex = new AtomicInteger(0);
                                    - generic [ref=e489]: "@Override"
                                    - generic [ref=e490]: "public Thread newThread(Runnable r) {"
                                    - generic [ref=e491]: return new Thread(r, "NettyClientWorkerThread_" + this.threadIndex.incrementAndGet());
                                    - text: "}"
                                    - text: "});"
                                    - generic [ref=e492]: /*
                                    - generic [ref=e493]: "* 初始化netty客户端"
                                    - generic [ref=e494]: "*/"
                                    - generic [ref=e495]: //eventLoopGroupWorker线程组，默认一个线程
                                    - generic [ref=e496]: Bootstrap handler = this.bootstrap.group(this.eventLoopGroupWorker).channel(NioSocketChannel.class)
                                    - generic [ref=e497]: //对应于套接字选项中的TCP_NODELAY，该参数的使用与Nagle算法有关
                                    - generic [ref=e498]: .option(ChannelOption.TCP_NODELAY, true)
                                    - generic [ref=e499]: //对应于套接字选项中的SO_KEEPALIVE，该参数用于设置TCP连接，当设置该选项以后，连接会测试链接的状态
                                    - generic [ref=e500]: .option(ChannelOption.SO_KEEPALIVE, false)
                                    - generic [ref=e501]: //用来设置连接超时时长，单位是毫秒，默认3000
                                    - text: .option(ChannelOption.CONNECT_TIMEOUT_MILLIS, nettyClientConfig.getConnectTimeoutMillis())
                                    - generic [ref=e502]: ".handler(new ChannelInitializer<SocketChannel>() {"
                                    - generic [ref=e503]: "@Override"
                                    - generic [ref=e504]: "public void initChannel(SocketChannel ch) throws Exception {"
                                    - generic [ref=e505]: ChannelPipeline pipeline = ch.pipeline();
                                    - generic [ref=e506]: "if (nettyClientConfig.isUseTLS()) {"
                                    - generic [ref=e507]: "if (null != sslContext) {"
                                    - generic [ref=e508]: pipeline.addFirst(defaultEventExecutorGroup, "sslHandler", sslContext.newHandler(ch.alloc()));
                                    - generic [ref=e509]: log.info("Prepend SSL handler");
                                    - generic [ref=e510]: "} else {"
                                    - generic [ref=e511]: log.warn("Connections are insecure as SSLContext is null!");
                                    - text: "}"
                                    - text: "}"
                                    - generic [ref=e512]: //为defaultEventExecutorGroup，添加handler
                                    - text: pipeline.addLast(
                                    - text: defaultEventExecutorGroup,
                                    - generic [ref=e513]: //RocketMQ自定义的请求解码器
                                    - generic [ref=e514]: new NettyEncoder(),
                                    - generic [ref=e515]: //RocketMQ自定义的请求编码器
                                    - generic [ref=e516]: new NettyDecoder(),
                                    - generic [ref=e517]: //Netty自带的心跳管理器，主要是用来检测远端是否存活
                                    - generic [ref=e518]: //即测试端一定时间内未接受到被测试端消息和一定时间内向被测试端发送消息的超时时间为120秒
                                    - generic [ref=e519]: new IdleStateHandler(0, 0, nettyClientConfig.getClientChannelMaxIdleTimeSeconds()),
                                    - generic [ref=e520]: //连接管理器，他负责连接的激活、断开、超时、异常等事件
                                    - generic [ref=e521]: new NettyConnectManageHandler(),
                                    - generic [ref=e522]: //服务请求处理器，处理RemotingCommand消息，即请求和响应的业务处理，并且返回相应的处理结果。这是重点
                                    - generic [ref=e523]: //例如broker注册、producer/consumer获取Broker、Topic信息等请求都是该处理器处理
                                    - generic [ref=e524]: //serverHandler最终会将请求根据不同的消息类型code分发到不同的process线程池处理
                                    - generic [ref=e525]: new NettyClientHandler());
                                    - text: "}"
                                    - text: "});"
                                    - generic [ref=e526]: "if (nettyClientConfig.getClientSocketSndBufSize() > 0) {"
                                    - generic [ref=e527]: "log.info(\"client set SO_SNDBUF to {}\", nettyClientConfig.getClientSocketSndBufSize());"
                                    - text: handler.option(ChannelOption.SO_SNDBUF, nettyClientConfig.getClientSocketSndBufSize());
                                    - text: "}"
                                    - generic [ref=e528]: "if (nettyClientConfig.getClientSocketRcvBufSize() > 0) {"
                                    - generic [ref=e529]: "log.info(\"client set SO_RCVBUF to {}\", nettyClientConfig.getClientSocketRcvBufSize());"
                                    - text: handler.option(ChannelOption.SO_RCVBUF, nettyClientConfig.getClientSocketRcvBufSize());
                                    - text: "}"
