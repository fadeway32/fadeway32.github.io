            - heading "3.2.1.3 getAndCreateChannel随机选择nameServer建立连接3.2.1.3 getAndCreateChannel随机选择nameServer建立连接" [level=5] [ref=e881]:
                - link "3.2.1.3 getAndCreateChannel随机选择nameServer建立连接":
                    - /url: "#3-2-1-3-getAndCreateChannel随机选择nameServer建立连接"
                - text: 3.2.1.3 getAndCreateChannel随机选择nameServer建立连接
            - paragraph [ref=e882]: getAndCreateChannel方法根据addr建立连接获取channel，随机选择nameServer连接的逻辑就在这里。
            - paragraph [ref=e883]: 简单的说，首先获取一个随机位于nameServer集合长度范围内的整数，作为第一个被选取的nameServer的地址，然后夯实建立长连接，如果建立成功，那么该长连接还会被放入缓存中，以后可以直接使用，这说明，同一个客户端应用中，不同的consumer和produer可以共用同一个nameServer的长连接。
            - paragraph [ref=e884]: 如果没有建立连接成功，那么选择当前位置开始的下一个nameServer地址继续尝试建立长连接，直到最后成功为止。如果所有nameServer都建立长连接失败，那么最终会抛出异常。
