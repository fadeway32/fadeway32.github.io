                                    - generic [ref=e730]: changed = this.isNeedUpdateTopicRouteInfo(topic);
                                    - generic [ref=e731]: "} else {"
                                    - generic [ref=e732]: "log.info(\"the topic[{}] route info changed, old[{}] ,new[{}]\", topic, old, topicRouteData);"
                                    - text: "}"
                                    - generic [ref=e733]: /*
                                    - generic [ref=e734]: "* 5 如果需要更新本地路由信息，那么执行更新操作"
                                    - generic [ref=e735]: "*/"
                                    - generic [ref=e736]: "if (changed) {"
