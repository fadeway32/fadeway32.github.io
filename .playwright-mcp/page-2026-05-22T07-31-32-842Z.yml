            - paragraph [ref=e230]: 主要是defaultMQProducerImpl#start方法，该方法实现生产者的启动。主要步骤有如下几步：
            - paragraph [ref=e231]:
                - strong [ref=e232]: 1、
                - text: 调用checkConfig方法检查生产者的ProducerGroup是否符合规范，如果ProducerGroup为空，或者长度大于255个字符，或者包含非法字符（正常的匹配模式为
                - code [ref=e233]: ^[%|a-zA-Z0-9_-]+$）
                - text: ，或者生产者组名为默认组名DEFAULT_PRODUCER，满足以上任意条件都校验不通过抛出异常；
                - strong [ref=e234]: 2、
                - text: 调用getOrCreateMQClientInstance方法，然后根据clientId获取或者创建CreateMQClientInstance实例，并赋给mQClientFactory变量；
                - strong [ref=e235]: 3、
                - text: 将当前生产者注册到MQClientInstance实例的producerTable属性中；
                - strong [ref=e236]: 4、
                - text: 添加一个默认topic“TBW102”，将会在isAutoCreateTopicEnable属性开启时在broker上自动创建，RocketMQ会基于该Topic的配置创建新的Topic；
            - list [ref=e237]:
                - listitem [ref=e238]: 调用mQClientFactory#start方法启动CreateMQClientInstance客户端通信实例，初始化netty服务、各种定时任务、拉取消息服务、rebalanceService服务等等。
            - paragraph [ref=e239]:
                - strong [ref=e240]: 6、
                - text: 主动调用一次sendHeartbeatToAllBrokerWithLock发送心跳信息给所有broker；
                - strong [ref=e241]: 7、
                - text: 启动一个定时任务，移除超时的request方法的请求，并执行异常回调，任务间隔1s；
