                                    - text: nettyClientConfig.getWriteBufferLowWaterMark(), nettyClientConfig.getWriteBufferHighWaterMark()));
                                    - text: "}"
                                    - generic [ref=e533]: /*
                                    - generic [ref=e534]: "* 启动定时任务，初始启动3秒后执行，此后每隔1秒执行一次"
                                    - generic [ref=e535]: "* 扫描responseTable，将超时的ResponseFuture直接移除，并且执行这些超时ResponseFuture的回调"
                                    - generic [ref=e536]: "*/"
                                    - generic [ref=e537]: "this.timer.scheduleAtFixedRate(new TimerTask() {"
                                    - generic [ref=e538]: "@Override"
                                    - generic [ref=e539]: "public void run() {"
                                    - generic [ref=e540]: "try {"
                                    - generic [ref=e541]: NettyRemotingClient.this.scanResponseTable();
                                    - generic [ref=e542]: "} catch (Throwable e) {"
                                    - generic [ref=e543]: log.error("scanResponseTable exception", e);
                                    - text: "}"
                                    - text: "}"
                                    - generic [ref=e544]: "}, 1000 * 3, 1000);"
                                    - generic [ref=e545]: /*
                                    - generic [ref=e546]: "* 启动netty事件监听器，处理各种事件"
                                    - generic [ref=e547]: "*/"
