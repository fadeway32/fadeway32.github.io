                                    - text: "}"
                                    - text: "}"
                                    - generic [ref=e957]: //没有一个nameServer地址建立成功，那么抛出异常
                                    - generic [ref=e958]: throw new RemotingConnectException(addrList.toString());
                                    - text: "}"
                                    - generic [ref=e959]: "} finally {"
                                    - generic [ref=e960]: //解锁
