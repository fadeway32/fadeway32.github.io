                                        - text: public void start
                                        - generic [ref=e265]: (final boolean startFactory)
                                        - text: "throws MQClientException {"
                                    - generic [ref=e266]: //根据服务状态选择走不同的代码分支
                                    - generic [ref=e267]: "switch (this.serviceState) {"
                                    - generic [ref=e268]: /**
                                    - generic [ref=e269]: "* 服务仅仅创建，而不是启动状态，那么启动服务"
                                    - generic [ref=e270]: "*/"
                                    - generic [ref=e271]: "case CREATE_JUST:"
                                    - generic [ref=e272]: //首先修改服务状态为服务启动失败，如果最终启动成功则再修改为RUNNING
                                    - generic [ref=e273]: this.serviceState = ServiceState.START_FAILED;
                                    - generic [ref=e274]: /*
                                    - generic [ref=e275]: "* 1 检查生产者的配置信息"
                                    - generic [ref=e276]: "* 主要是检查ProducerGroup是否符合规范，"
                                    - generic [ref=e277]: "* 如果ProducerGroup为空，或者长度大于255个字符，或者包含非法字符（正常的匹配模式为 ^[%|a-zA-Z0-9_-]+$），或者生产者组名为默认组名DEFAULT_PRODUCER"
                                    - generic [ref=e278]: "* 满足以上任意条件都校验不通过抛出异常。"
                                    - generic [ref=e279]: "*/"
                                    - generic [ref=e280]: this.checkConfig();
                                    - generic [ref=e281]: //如果ProducerGroup不是CLIENT_INNER_PRODUCER，那么将修改当前的instanceName为当前进程pid，PID就是服务的进程号。
                                    - generic [ref=e282]: //CLIENT_INNER_PRODUCER是客户端内部的生产者组名，该生产者用于发送消息回退请求
                                    - generic [ref=e283]: "if (!this.defaultMQProducer.getProducerGroup().equals(MixAll.CLIENT_INNER_PRODUCER_GROUP)) {"
                                    - generic [ref=e284]: this.defaultMQProducer.changeInstanceNameToPID();
                                    - text: "}"
                                    - generic [ref=e285]: /*
                                    - generic [ref=e286]: "* 2 获取MQClientManager实例，然后根据clientId获取或者创建CreateMQClientInstance实例，并赋给mQClientFactory变量"
                                    - generic [ref=e287]: "*/"
                                    - generic [ref=e288]: this.mQClientFactory = MQClientManager.getInstance().getOrCreateMQClientInstance(this.defaultMQProducer, rpcHook);
                                    - generic [ref=e289]: /*
                                    - generic [ref=e290]: "* 3 将当前生产者注册到MQClientInstance实例的producerTable属性中"
                                    - generic [ref=e291]: "*/"
                                    - generic [ref=e292]: boolean registerOK = mQClientFactory.registerProducer(this.defaultMQProducer.getProducerGroup(), this);
                                    - generic [ref=e293]: //如果注册失败，那么设置服务属性为CREATE_JUST，并抛出异常
                                    - generic [ref=e294]: "if (!registerOK) {"
                                    - generic [ref=e295]: this.serviceState = ServiceState.CREATE_JUST;
                                    - generic [ref=e296]: throw new MQClientException("The producer group[" + this.defaultMQProducer.getProducerGroup()
                                    - generic [ref=e297]: + "] has been created before, specify another name please." + FAQUrl.suggestTodo(FAQUrl.GROUP_NAME_DUPLICATE_URL),
                                    - generic [ref=e298]: null);
                                    - text: "}"
                                    - generic [ref=e299]: //添加一个默认topic “TBW102”，将会在isAutoCreateTopicEnable属性开启时在broker上自动创建，RocketMQ会基于该Topic的配置创建新的Topic
                                    - generic [ref=e300]: this.topicPublishInfoTable.put(this.defaultMQProducer.getCreateTopicKey(), new TopicPublishInfo());
                                    - generic [ref=e301]: /*
                                    - generic [ref=e302]: "* 4 启动CreateMQClientInstance客户端通信实例"
                                    - generic [ref=e303]: "* netty服务、各种定时任务、拉取消息服务、rebalanceService服务"
                                    - generic [ref=e304]: "*/"
                                    - generic [ref=e305]: "if (startFactory) {"
                                    - text: mQClientFactory.start();
                                    - text: "}"
                                    - generic [ref=e306]: "log.info(\"the producer [{}] start OK. sendMessageWithVIPChannel={}\", this.defaultMQProducer.getProducerGroup(),"
                                    - generic [ref=e307]: this.defaultMQProducer.isSendMessageWithVIPChannel());
                                    - generic [ref=e308]: //服务状态改为RUNNING
                                    - generic [ref=e309]: this.serviceState = ServiceState.RUNNING;
                                    - generic [ref=e310]: break;
                                    - generic [ref=e311]: /**
                                    - generic [ref=e312]: "* 服务状态是其他的，那么抛出异常，即start方法仅能调用一次"
                                    - generic [ref=e313]: "*/"
                                    - generic [ref=e314]: "case RUNNING:"
                                    - generic [ref=e315]: "case START_FAILED:"
                                    - generic [ref=e316]: "case SHUTDOWN_ALREADY:"
                                    - generic [ref=e317]: throw new MQClientException("The producer service state not OK, maybe started once, "
                                    - generic [ref=e318]: + this.serviceState
                                    - text: + FAQUrl.suggestTodo(FAQUrl.CLIENT_SERVICE_NOT_OK),
                                    - generic [ref=e319]: null);
                                    - generic [ref=e320]: "default:"
                                    - generic [ref=e321]: break;
                                    - text: "}"
                                    - generic [ref=e322]: /*
                                    - generic [ref=e323]: "* 5 发送心跳信息给所有broker"
                                    - generic [ref=e324]: "*/"
                                    - generic [ref=e325]: this.mQClientFactory.sendHeartbeatToAllBrokerWithLock();
                                    - generic [ref=e326]: /*
                                    - generic [ref=e327]: "* 6 启动一个定时任务，移除超时的请求，并执行异常回调，任务间隔1s"
                                    - generic [ref=e328]: "*/"
                                    - generic [ref=e329]: RequestFutureHolder.getInstance().startScheduledTask(this);
                                    - text: "}"
