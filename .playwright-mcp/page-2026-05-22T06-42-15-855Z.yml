                                    - text: "public class MergeSort implements IArraySort {"
                                    - text: "@Override"
                                    - text: "public int[] sort(int[] sourceArray) throws Exception {"
                                    - text: // 对 arr 进行拷贝，不改变参数内容
                                    - text: int[] arr = Arrays.copyOf(sourceArray, sourceArray.length);
                                    - text: "if (arr.length < 2) {"
                                    - text: return arr;
                                    - text: "}"
                                    - text: int middle = (int) Math.floor(arr.length / 2);
                                    - text: int[] left = Arrays.copyOfRange(arr, 0, middle);
                                    - text: int[] right = Arrays.copyOfRange(arr, middle, arr.length);
                                    - text: return merge(sort(left), sort(right));
                                    - text: "}"
                                    - text: "protected int[] merge(int[] left, int[] right) {"
                                    - text: int[] result = new int[left.length + right.length];
                                    - text: int i = 0;
                                    - text: "while (left.length > 0 && right.length > 0) {"
                                    - text: "if (left[0] <= right[0]) {"
                                    - text: result[i++] = left[0];
                                    - text: left = Arrays.copyOfRange(left, 1, left.length);
                                    - text: "} else {"
                                    - text: result[i++] = right[0];
                                    - text: right = Arrays.copyOfRange(right, 1, right.length);
                                    - text: "}"
                                    - text: "}"
                                    - text: "while (left.length > 0) {"
