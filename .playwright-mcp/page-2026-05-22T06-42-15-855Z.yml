                                    - text: "public class BucketSort implements IArraySort {"
                                    - text: private static final InsertSort insertSort = new InsertSort();
                                    - text: "@Override"
                                    - text: "public int[] sort(int[] sourceArray) throws Exception {"
                                    - text: // 对 arr 进行拷贝，不改变参数内容
                                    - text: int[] arr = Arrays.copyOf(sourceArray, sourceArray.length);
                                    - text: return bucketSort(arr, 5);
                                    - text: "}"
                                    - text: "private int[] bucketSort(int[] arr, int bucketSize) throws Exception {"
                                    - text: "if (arr.length == 0) {"
                                    - text: return arr;
                                    - text: "}"
                                    - text: int minValue = arr[0];
                                    - text: int maxValue = arr[0];
                                    - text: "for (int value : arr) {"
                                    - text: "if (value < minValue) {"
                                    - text: minValue = value;
                                    - text: "} else if (value > maxValue) {"
                                    - text: maxValue = value;
                                    - text: "}"
                                    - text: "}"
                                    - text: int bucketCount = (int) Math.floor((maxValue - minValue) / bucketSize) + 1;
                                    - text: int[][] buckets = new int[bucketCount][0];
                                    - text: // 利用映射函数将数据分配到各个桶中
                                    - text: "for (int i = 0; i < arr.length; i++) {"
                                    - text: int index = (int) Math.floor((arr[i] - minValue) / bucketSize);
                                    - text: buckets[index] = arrAppend(buckets[index], arr[i]);
                                    - text: "}"
                                    - text: int arrIndex = 0;
                                    - text: "for (int[] bucket : buckets) {"
                                    - text: "if (bucket.length <= 0) {"
                                    - text: continue;
                                    - text: "}"
                                    - text: // 对每个桶进行排序，这里使用了插入排序
                                    - text: bucket = insertSort.sort(bucket);
                                    - text: "for (int value : bucket) {"
                                    - text: arr[arrIndex++] = value;
                                    - text: "}"
                                    - text: "}"
                                    - text: return arr;
                                    - text: "}"
                                    - text: /**
                                    - text: "* 自动扩容，并保存数据"
                                    - text: "*"
                                    - text: "* @param arr"
                                    - text: "* @param value"
                                    - text: "*/"
