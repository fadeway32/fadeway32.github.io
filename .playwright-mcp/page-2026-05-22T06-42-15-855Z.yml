                                    - text: "}"
                                    - text: "while (right.length > 0) {"
                                    - text: result[i++] = right[0];
                                    - text: right = Arrays.copyOfRange(right, 1, right.length);
                                    - text: "}"
                                    - text: return result;
                                    - text: "}"
                                    - text: "}"
            - heading "6. 快速排序6. 快速排序" [level=3] [ref=e262]:
