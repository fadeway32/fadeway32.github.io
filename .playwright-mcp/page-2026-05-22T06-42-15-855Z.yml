            - heading "6.1 算法步骤6.1 算法步骤" [level=4] [ref=e263]:
                - link "6.1 算法步骤":
                    - /url: "#6-1-算法步骤"
                - text: 6.1 算法步骤
            - list [ref=e264]:
                - listitem [ref=e265]: 从数列中挑出一个元素，称为 “基准”（pivot）;
                - listitem [ref=e266]: 重新排序数列，所有元素比基准值小的摆放在基准前面，所有元素比基准值大的摆在基准的后面（相同的数可以到任一边）。在这个分区退出之后，该基准就处于数列的中间位置。这个称为分区（partition）操作；
                - listitem [ref=e267]: 递归地（recursive）把小于基准值元素的子数列和大于基准值元素的子数列排序；
