                                    - text: //Java 代码实现
                                    - text: "public class RadixSort implements IArraySort {"
                                    - text: "@Override"
                                    - text: "public int[] sort(int[] sourceArray) throws Exception {"
                                    - text: // 对 arr 进行拷贝，不改变参数内容
                                    - text: int[] arr = Arrays.copyOf(sourceArray, sourceArray.length);
                                    - text: int maxDigit = getMaxDigit(arr);
                                    - text: return radixSort(arr, maxDigit);
                                    - text: "}"
                                    - text: /**
                                    - text: "* 获取最高位数"
                                    - text: "*/"
                                    - text: "private int getMaxDigit(int[] arr) {"
                                    - text: int maxValue = getMaxValue(arr);
                                    - text: return getNumLenght(maxValue);
                                    - text: "}"
                                    - text: "private int getMaxValue(int[] arr) {"
                                    - text: int maxValue = arr[0];
                                    - text: "for (int value : arr) {"
                                    - text: "if (maxValue < value) {"
                                    - text: maxValue = value;
                                    - text: "}"
                                    - text: "}"
                                    - text: return maxValue;
                                    - text: "}"
                                    - text: "protected int getNumLenght(long num) {"
                                    - text: "if (num == 0) {"
                                    - text: return 1;
                                    - text: "}"
                                    - text: int lenght = 0;
                                    - text: "for (long temp = num; temp != 0; temp /= 10) {"
                                    - text: lenght++;
                                    - text: "}"
                                    - text: return lenght;
                                    - text: "}"
                                    - text: "private int[] radixSort(int[] arr, int maxDigit) {"
                                    - text: int mod = 10;
                                    - text: int dev = 1;
                                    - text: "for (int i = 0; i < maxDigit; i++, dev *= 10, mod *= 10) {"
                                    - text: // 考虑负数的情况，这里扩展一倍队列数，其中 [0-9]对应负数，[10-19]对应正数 (bucket + 10)
                                    - text: int[][] counter = new int[mod * 2][0];
                                    - text: "for (int j = 0; j < arr.length; j++) {"
                                    - text: int bucket = ((arr[j] % mod) / dev) + mod;
                                    - text: counter[bucket] = arrayAppend(counter[bucket], arr[j]);
                                    - text: "}"
                                    - text: int pos = 0;
                                    - text: "for (int[] bucket : counter) {"
                                    - text: "for (int value : bucket) {"
                                    - text: arr[pos++] = value;
                                    - text: "}"
                                    - text: "}"
                                    - text: "}"
                                    - text: return arr;
                                    - text: "}"
                                    - text: "private int[] arrayAppend(int[] arr, int value) {"
                                    - text: arr = Arrays.copyOf(arr, arr.length + 1);
                                    - text: arr[arr.length - 1] = value;
                                    - text: return arr;
                                    - text: "}"
                                    - text: "}"
