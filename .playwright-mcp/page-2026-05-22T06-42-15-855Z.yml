                - text: 十大排序算法
            - paragraph [ref=e109]:
                - text: 排序算法可以分为
                - strong [ref=e110]: 内部排序
                - text: 和
                - strong [ref=e111]: 外部排序
                - text: 。
            - paragraph [ref=e112]: 内部排序是数据记录在内存中进行排序。
            - paragraph [ref=e113]: 而外部排序是因排序的数据很大，一次不能容纳全部的排序记录，在排序过程中需要访问外存。
            - paragraph [ref=e114]: 常见的内部排序算法有：插入排序、希尔排序、选择排序、冒泡排序、归并排序、快速排序、堆排序、基数排序等。
            - paragraph [ref=e115]: 用一张图概括：
            - paragraph [ref=e116]:
                - link "image" [ref=e117] [cursor=pointer]:
                    - /url: https://gitee.com/fadeway32/fadeway32/raw/master/img/202503042009332.webp
                    - img "image" [ref=e118]
            - heading "关于时间复杂度：关于时间复杂度：" [level=4] [ref=e119]:
                - link "关于时间复杂度：":
                    - /url: "#关于时间复杂度："
                - text: 关于时间复杂度：
            - list [ref=e120]:
                - listitem [ref=e121]: 平方阶 (O(n2)) 排序 各类简单排序：直接插入、直接选择和冒泡排序。
                - listitem [ref=e122]: 线性对数阶 (O(nlog2n)) 排序 快速排序、堆排序和归并排序；
                - listitem [ref=e123]: O(n1+§)) 排序，§ 是介于 0 和 1 之间的常数。 希尔排序
                - listitem [ref=e124]: 线性阶 (O(n)) 排序 基数排序，此外还有桶、箱排序。
            - heading "关于稳定性：关于稳定性：" [level=4] [ref=e125]:
                - link "关于稳定性：":
                    - /url: "#关于稳定性："
                - text: 关于稳定性：
            - list [ref=e126]:
                - listitem [ref=e127]: 稳定的排序算法：冒泡排序、插入排序、归并排序和基数排序。
                - listitem [ref=e128]: 不是稳定的排序算法：选择排序、快速排序、希尔排序、堆排序。
            - heading "1. 冒泡排序1. 冒泡排序" [level=3] [ref=e129]:
                - link "1. 冒泡排序":
                    - /url: "#1-冒泡排序"
                - text: 1. 冒泡排序
            - heading "1.1 算法步骤1.1 算法步骤" [level=4] [ref=e130]:
                - link "1.1 算法步骤":
                    - /url: "#1-1-算法步骤"
                - text: 1.1 算法步骤
            - list [ref=e131]:
                - listitem [ref=e132]: 比较相邻的元素。如果第一个比第二个大，就交换他们两个。
                - listitem [ref=e133]: 对每一对相邻元素作同样的工作，从开始第一对到结尾的最后一对。这步做完后，最后的元素会是最大的数。
                - listitem [ref=e134]: 针对所有的元素重复以上的步骤，除了最后一个。
                - listitem [ref=e135]: 持续每次对越来越少的元素重复上面的步骤，直到没有任何一对数字需要比较。
