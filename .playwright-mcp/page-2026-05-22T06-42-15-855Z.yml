            - list [ref=e208]:
                - listitem [ref=e209]: 申请空间，使其大小为两个已经排序序列之和，该空间用来存放合并后的序列；
                - listitem [ref=e210]: 设定两个指针，最初位置分别为两个已经排序序列的起始位置；
                - listitem [ref=e211]: 比较两个指针所指向的元素，选择相对小的元素放入到合并空间，并移动指针到下一位置；
                - listitem [ref=e212]: 重复步骤 3 直到某一指针达到序列尾；
                - listitem [ref=e213]: 将另一序列剩下的所有元素直接复制到合并序列尾。
